# Despliegue manual a AWS con OIDC (sin claves estáticas). Requiere:
#   - Environment "production" en GitHub con aprobación obligatoria (reviewers).
#   - Secret AWS_DEPLOY_ROLE_ARN: rol IAM con trust OIDC acotado a este repo + environment.
#   - Variables del environment (Settings > Environments > production > Variables):
#       APP_BASE_URL, DOMAIN_NAME, CERTIFICATE_ARN, COGNITO_DOMAIN_PREFIX, ALERT_EMAIL,
#       MONTHLY_BUDGET_USD (opcional), CLOUDFRONT_PREFIX_LIST_ID (opcional).
# Orden: FoundationStack (crea el ECR) -> build+push de la imagen -> cdk deploy --all.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Etapa a desplegar (prefija todos los recursos)
        type: choice
        options: [prod, staging]
        default: prod
      image_tag:
        description: Tag de la imagen (vacío = SHA del commit)
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      # TODO: anclar por SHA (verificar el commit del tag v4 en github.com/aws-actions/configure-aws-credentials).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: helixona-deploy-${{ inputs.stage }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment context
        id: ctx
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/helixona-${{ inputs.stage }}-api" >> "$GITHUB_OUTPUT"
          {
            echo "cdk_context<<EOF"
            echo "-c stage=${{ inputs.stage }}"
            echo "-c imageTag=$TAG"
            echo "-c appBaseUrl=${{ vars.APP_BASE_URL }}"
            echo "-c domainName=${{ vars.DOMAIN_NAME }}"
            echo "-c certificateArn=${{ vars.CERTIFICATE_ARN }}"
            echo "-c cognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}"
            echo "-c alertEmail=${{ vars.ALERT_EMAIL }}"
            echo "-c monthlyBudgetUsd=${{ vars.MONTHLY_BUDGET_USD || '1500' }}"
            echo "-c cloudFrontPrefixListId=${{ vars.CLOUDFRONT_PREFIX_LIST_ID }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deploy FoundationStack (KMS, tablas, ECR)
        working-directory: packages/infra
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy "Helixona-${{ inputs.stage }}-Foundation" --require-approval never $CDK_CONTEXT
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.ctx.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_CONTEXT: ${{ steps.ctx.outputs.cdk_context }}

      # TODO: anclar por SHA (verificar el commit del tag v2 en github.com/aws-actions/amazon-ecr-login).
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          set -euo pipefail
          docker build \
            --file packages/api/Dockerfile \
            --tag "${{ steps.ctx.outputs.ecr_uri }}:${{ steps.ctx.outputs.image_tag }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .
          docker push "${{ steps.ctx.outputs.ecr_uri }}:${{ steps.ctx.outputs.image_tag }}"

      - name: Deploy all stacks
        working-directory: packages/infra
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy --all --require-approval never $CDK_CONTEXT
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.ctx.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_CONTEXT: ${{ steps.ctx.outputs.cdk_context }}

      - name: Post-deploy reminder
        run: |
          echo "::notice::Si es el primer despliegue: copiar el client secret de Cognito en Secrets Manager (helixona-${{ inputs.stage }}-cognito-client-secret) y forzar un nuevo despliegue del servicio ECS. Ver packages/infra/README.md."
