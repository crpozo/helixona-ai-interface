# Despliegue manual a AWS con OIDC (sin claves estáticas). Requiere:
#   - Environment "production" en GitHub con aprobación obligatoria (reviewers).
#   - Secret AWS_DEPLOY_ROLE_ARN: rol IAM con trust OIDC acotado a este repo + environment.
#   - Variables del environment (Settings > Environments > production > Variables):
#       APP_BASE_URL, COGNITO_DOMAIN_PREFIX, ALERT_EMAIL,
#       DOMAIN_NAME + CERTIFICATE_ARN (van juntas; vacías = URL por defecto de CloudFront, ver
#       packages/infra/README.md "Sin dominio propio"), MONTHLY_BUDGET_USD (opcional),
#       CLOUDFRONT_PREFIX_LIST_ID (opcional), LLM_MODE (opcional, default anthropic),
#       ENABLE_CLOUDTRAIL (opcional, default true: trail propio con data events de S3/DynamoDB;
#       poner "false" si la organización ya entrega un trail a la cuenta).
# Orden: FoundationStack (crea el ECR) -> build+push de la imagen -> cdk deploy --all.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy (prefixes every resource name)
        type: choice
        options: [prod, staging]
        default: prod
      image_tag:
        description: Image tag (empty = commit SHA)
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      # Diagnóstico: qué identidad OIDC presenta GitHub (debe coincidir con la trust policy del rol:
      # sub = repo:<org>/<repo>:environment:<environment>, aud = sts.amazonaws.com) y que el secreto
      # AWS_DEPLOY_ROLE_ARN tenga forma de ARN de rol. No imprime el token ni el secreto completo.
      - name: Verify OIDC identity and role ARN format
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, sys, time, urllib.request
          # Diagnostic only: GitHub's token service occasionally answers 503. Retry, then carry on
          # without the claims rather than failing the deploy before it has started.
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          claims = {}
          for attempt in range(5):
              try:
                  jwt = json.load(urllib.request.urlopen(req, timeout=20))["value"]
                  payload = jwt.split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload))
                  break
              except Exception as e:  # noqa: BLE001
                  print(f"OIDC token request failed (attempt {attempt + 1}/5): {e}")
                  time.sleep(2 ** attempt)
          if claims:
              print("OIDC token claims AWS receives:")
              for k in ("iss", "aud", "sub", "repository", "repository_owner", "environment", "ref", "event_name"):
                  print(f"  {k}: {claims.get(k)}")
          else:
              print("::warning::Could not read the OIDC token for diagnostics; the credentials step below will still try to assume the role.")
          arn = os.environ.get("ROLE_ARN", "")
          m = re.fullmatch(r"arn:aws:iam::(\d{12}):role/([A-Za-z0-9+=,.@_/-]+)", arn)
          if not m:
              print(f"::error::The AWS_DEPLOY_ROLE_ARN secret is not an IAM role ARN (length {len(arn)}, "
                    f"{'with' if arn != arn.strip() else 'without'} leading/trailing whitespace).")
              sys.exit(1)
          print(f"AWS_DEPLOY_ROLE_ARN: valid format (account {m.group(1)}, role {m.group(2)})")
          if claims:
              print("The role trust policy must allow exactly:")
              print(f"  token.actions.githubusercontent.com:sub = {claims.get('sub')}")
              print(f"  token.actions.githubusercontent.com:aud = sts.amazonaws.com")
          PY

      # TODO: anclar por SHA (verificar el commit del tag v4 en github.com/aws-actions/configure-aws-credentials).
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: helixona-deploy-${{ inputs.stage }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment context
        id: ctx
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ecr_uri=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/helixona-${{ inputs.stage }}-api" >> "$GITHUB_OUTPUT"
          {
            echo "cdk_context<<EOF"
            echo "-c stage=${{ inputs.stage }}"
            echo "-c imageTag=$TAG"
            echo "-c appBaseUrl=${{ vars.APP_BASE_URL }}"
            echo "-c domainName=${{ vars.DOMAIN_NAME }}"
            echo "-c certificateArn=${{ vars.CERTIFICATE_ARN }}"
            echo "-c cognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}"
            echo "-c alertEmail=${{ vars.ALERT_EMAIL }}"
            echo "-c monthlyBudgetUsd=${{ vars.MONTHLY_BUDGET_USD || '1500' }}"
            echo "-c cloudFrontPrefixListId=${{ vars.CLOUDFRONT_PREFIX_LIST_ID }}"
            echo "-c llmMode=${{ vars.LLM_MODE || 'anthropic' }}"
            echo "-c enableCloudTrail=${{ vars.ENABLE_CLOUDTRAIL || 'true' }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

      - name: Deploy FoundationStack (KMS, tables, ECR)
        working-directory: packages/infra
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy "Helixona-${{ inputs.stage }}-Foundation" --require-approval never $CDK_CONTEXT
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.ctx.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_CONTEXT: ${{ steps.ctx.outputs.cdk_context }}

      # TODO: anclar por SHA (verificar el commit del tag v2 en github.com/aws-actions/amazon-ecr-login).
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          set -euo pipefail
          docker build \
            --file packages/api/Dockerfile \
            --tag "${{ steps.ctx.outputs.ecr_uri }}:${{ steps.ctx.outputs.image_tag }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            .
          docker push "${{ steps.ctx.outputs.ecr_uri }}:${{ steps.ctx.outputs.image_tag }}"

      # One-time ordering step (remove after the deploy that introduces the HTTPS listener succeeds):
      # the monitoring stack used to import the HTTP listener, and CloudFormation refuses to swap a
      # listener while another stack still imports it. Updating the monitoring stack first drops the
      # import so the app stack can replace the listener.
      - name: Deploy ObservabilityStack first (drops its import of the HTTP listener)
        working-directory: packages/infra
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy "Helixona-${{ inputs.stage }}-Observability" --exclusively --require-approval never $CDK_CONTEXT
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.ctx.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_CONTEXT: ${{ steps.ctx.outputs.cdk_context }}

      - name: Deploy all stacks
        working-directory: packages/infra
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx cdk deploy --all --require-approval never $CDK_CONTEXT
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.ctx.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          CDK_CONTEXT: ${{ steps.ctx.outputs.cdk_context }}

      - name: Post-deploy reminder
        run: |
          echo "::notice::First deployment only: copy the Cognito client secret into Secrets Manager (helixona-${{ inputs.stage }}-cognito-client-secret) and force a new ECS service deployment. See packages/infra/README.md."
