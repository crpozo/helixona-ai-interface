# CI del monorepo: typecheck, tests, build y synth de la infraestructura (sin credenciales AWS).
# Acciones ancladas por SHA (supply chain): actualizar SHA y comentario de versión a la vez.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, synth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: CDK synth (cuenta/región ficticias, cdk-nag bloquea en error)
        run: npm run synth -w @helixona/infra
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-1

      # Escaneo de dependencias de producción. No bloquea el pipeline (informativo) hasta que el
      # equipo decida el umbral; el resultado queda en el log del job.
      - name: npm audit (producción, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
